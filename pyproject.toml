[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskmesh"
version = "0.1.0"
description = "Open source quantitative enterprise risk management: Monte Carlo risk analysis with a REST API and pluggable storage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The RiskMesh Authors" }]
keywords = ["risk management", "ERM", "Monte Carlo", "quantitative risk", "GRC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
sql = ["sqlalchemy>=2.0"]
neo4j = ["neo4j>=5.0"]
all = ["riskmesh[api,sql,neo4j]"]
dev = ["riskmesh[all]", "pytest>=8.0", "httpx>=0.27", "pyflakes>=3.0"]

[project.scripts]
riskmesh = "riskmesh.presentation.cli:main"

[project.urls]
Source = "https://github.com/mfalck/riskmesh"
"Web front end" = "https://github.com/mfalck/riskmesh-web"

[tool.setuptools.packages.find]
include = ["riskmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
