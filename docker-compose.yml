# RiskMesh with PostgreSQL and nightly backups.
#
#   cp .env.example .env        # set passwords
#   docker compose up -d --build
#   -> API on http://localhost:8000/docs, log in with RISKMESH_ADMIN_USER / RISKMESH_ADMIN_PASSWORD
#
# Put a riskmesh.toml in ./config for further settings (single sign-on, scoring, ...);
# the environment variables below override it.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: riskmesh
      POSTGRES_USER: riskmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskmesh -d riskmesh"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: riskmesh:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RISKMESH_BACKEND: sql
      RISKMESH_SQL_URL: postgresql+psycopg://riskmesh:${POSTGRES_PASSWORD}@db:5432/riskmesh
      RISKMESH_AUTH_MODE: ${RISKMESH_AUTH_MODE:-local}
      RISKMESH_ADMIN_USER: ${RISKMESH_ADMIN_USER:-admin}
      RISKMESH_ADMIN_PASSWORD: ${RISKMESH_ADMIN_PASSWORD:?set RISKMESH_ADMIN_PASSWORD in .env}
      RISKMESH_CORS_ORIGINS: ${RISKMESH_CORS_ORIGINS:-}
      RISKMESH_OIDC_CLIENT_SECRET: ${RISKMESH_OIDC_CLIENT_SECRET:-}
    command: ["riskmesh", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "${RISKMESH_WORKERS:-2}"]
    ports:
      - "${RISKMESH_PORT:-8000}:8000"
    volumes:
      - ./config:/config:ro

  # Nightly database dump; keeps 30 days. Restore with:
  #   gunzip -c backups/<file>.sql.gz | docker compose exec -T db psql -U riskmesh riskmesh
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/riskmesh-$$(date +%Y-%m-%d_%H%M).sql.gz
          pg_dump -h db -U riskmesh riskmesh | gzip > "$$f" && echo "backup $$f"
          find /backups -name 'riskmesh-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done

volumes:
  pgdata:
